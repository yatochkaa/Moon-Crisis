<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Moon Courier Crisis hero</title>
  <desc id="desc">A dark lunar delivery map with rover routes, order beacons, battery and risk indicators.</desc>
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AAB0B8" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#4A515B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B1017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="250" y1="260" x2="850" y2="120">
      <stop stop-color="#FF8A2A"/>
      <stop offset="0.55" stop-color="#4DB8FF"/>
      <stop offset="1" stop-color="#75E0A8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#090D14"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="760" cy="210" r="380" fill="url(#moonGlow)"/>

  <g opacity="0.28">
    <circle cx="720" cy="150" r="54" stroke="#D9DEE8" stroke-width="2"/>
    <circle cx="845" cy="245" r="34" stroke="#D9DEE8" stroke-width="2"/>
    <circle cx="1000" cy="115" r="68" stroke="#D9DEE8" stroke-width="2"/>
    <circle cx="565" cy="300" r="28" stroke="#D9DEE8" stroke-width="2"/>
    <path d="M510 102C560 82 620 84 682 110" stroke="#D9DEE8" stroke-opacity="0.45"/>
    <path d="M842 335C905 309 974 310 1035 343" stroke="#D9DEE8" stroke-opacity="0.4"/>
  </g>

  <path d="M220 282 C345 210 438 304 548 238 S724 108 868 138 S985 224 1042 155" stroke="url(#route)" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 14"/>
  <path d="M228 284 C336 345 430 350 540 300" stroke="#E56458" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" opacity="0.8"/>

  <g filter="url(#softShadow)">
    <rect x="74" y="72" width="390" height="250" rx="22" fill="#101721" stroke="#273244"/>
    <text x="104" y="124" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800">Moon Courier</text>
    <text x="104" y="166" fill="#FF8A2A" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800">Crisis</text>
    <text x="104" y="210" fill="#B9C2D0" font-family="Inter, Arial, sans-serif" font-size="18">Lunar ration delivery strategy</text>
    <text x="104" y="240" fill="#7F8B9D" font-family="Inter, Arial, sans-serif" font-size="15">Balance weight, battery, route risk and base rating.</text>
    <g transform="translate(104 270)">
      <rect width="96" height="34" rx="10" fill="#172330" stroke="#2B3C52"/>
      <text x="17" y="22" fill="#75E0A8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">SQLite</text>
      <rect x="110" width="118" height="34" rx="10" fill="#172330" stroke="#2B3C52"/>
      <text x="126" y="22" fill="#4DB8FF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Next.js</text>
      <rect x="242" width="102" height="34" rx="10" fill="#172330" stroke="#2B3C52"/>
      <text x="260" y="22" fill="#FFB45E" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Prisma</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="220" cy="282" r="18" fill="#FF8A2A" stroke="#FFE2C4" stroke-width="3"/>
    <circle cx="548" cy="238" r="16" fill="#4DB8FF" stroke="#CFEFFF" stroke-width="3"/>
    <circle cx="868" cy="138" r="16" fill="#75E0A8" stroke="#D7FFE7" stroke-width="3"/>
    <circle cx="1042" cy="155" r="18" fill="#E56458" stroke="#FFD8D4" stroke-width="3"/>
  </g>

  <g transform="translate(820 258)" filter="url(#softShadow)">
    <rect width="292" height="94" rx="18" fill="#101721" stroke="#273244"/>
    <text x="24" y="34" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Delivery preview</text>
    <text x="24" y="61" fill="#B9C2D0" font-family="Inter, Arial, sans-serif" font-size="13">Battery −47% · Risk 38% · Reward +430</text>
    <rect x="24" y="73" width="244" height="6" rx="3" fill="#243044"/>
    <rect x="24" y="73" width="155" height="6" rx="3" fill="#FF8A2A"/>
  </g>
</svg>
